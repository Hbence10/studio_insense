<div class="container-fluid" id="mainContainer">
  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex justify-content-center align-items-center">

      <div class="container-fluid d-flex flex-column justify-content-between p-4" id="secondContainer">

        <div class="row">
          <div class="col-lg-12">
            <h1>Üdvözöljük!</h1>
            @if (errorMsg != "") {

            }
            <form [formGroup]="form" class="container-fluid mt-4">
              <div class="row">
                <mat-form-field appearance="outline">
                  <mat-label>E-mail</mat-label>
                  <input matInput formControlName="email">
                </mat-form-field>
              </div>
              <div class="row">
                <div class="col-lg-12">
                  <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Jelszó</mat-label>
                    <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" />
                    <button
                      matIconButton
                      matSuffix
                      (click)="clickEvent($event)"
                      [attr.aria-label]="'Hide password'"
                      [attr.aria-pressed]="hide()"
                    >
                      <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                  </mat-form-field>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12">
            <button class="w-100" matButton="filled" (click)="login()" [disabled]="form.invalid">Bejelentkezés</button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
