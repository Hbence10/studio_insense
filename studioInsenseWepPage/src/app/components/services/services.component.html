@if (
  languageService.selectedLanguage.language ==
  cookieService.get("studioInsenseSelectedLanguage")
) {
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-7">
        <div class="container-fluid">
          @for (service of languageService.selectedLanguage.services; track $index) {
            <div class="row">
              <div class="col-lg-12">
                <h5>{{service.title}}</h5>
                <p>{{service.text}}</p>
              </div>
            </div>
          }
        </div>
      </div>
      <div class="col-lg-5"></div>
    </div>
  </div>
}
