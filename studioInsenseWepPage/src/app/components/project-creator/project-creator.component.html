<div class="container-fluid" id="mainContainer">
  <div class="row h-100">
    <div class="col-lg-12 d-flex justify-content-center align-items-center">
      <form class="container-fluid" id="secondContainer">
        <div class="row">
          <div class="col-lg-12">
            <h2 class="text-center">Projekt létrehozása</h2>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <mat-form-field appearance="outline">
              <mat-label>Projekt neve (magyar)</mat-label>
              <input matInput type="text">
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <mat-form-field appearance="outline">
              <mat-label>Projekt neve (angol)</mat-label>
              <input matInput type="text">
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <mat-form-field appearance="outline">
              <mat-label>Projekt leírása (magyar)</mat-label>
              <input matInput type="text">
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <mat-form-field appearance="outline">
              <mat-label>Projekt leírása (angol)</mat-label>
              <input matInput type="text">
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <label for="">Projekthez tartozó képek:</label>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12">
            <button type="button" (click)="saveChanges()">Mentés</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
